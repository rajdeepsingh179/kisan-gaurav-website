name = "kisan-gaurav-api"
main = "src/index.js"
compatibility_date = "2026-07-26"
compatibility_flags = ["nodejs_compat"]

[vars]
FRONTEND_URL = "http://localhost:5173"
AUTH_URL = "http://localhost:8787/api/auth"
R2_PUBLIC_BASE_URL = "http://localhost:8787/api/media"

[[d1_databases]]
binding = "DB"
database_name = "kisan-gaurav-commerce"
database_id = "93f9a8b8-bbed-4750-b160-1a6790a33ede"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kisan-gaurav-media"

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *"]
