name = "kisan-gaurav-api"
main = "src/index.js"
compatibility_date = "2026-07-26"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [
  { pattern = "kisangaurav.com/api/*", zone_name = "kisangaurav.com" },
  { pattern = "www.kisangaurav.com/api/*", zone_name = "kisangaurav.com" }
]

[vars]
FRONTEND_URL = "https://kisangaurav.com"

[[d1_databases]]
binding = "DB"
database_name = "kisan-gaurav-commerce"
database_id = "93f9a8b8-bbed-4750-b160-1a6790a33ede"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kisan-gaurav-media"

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *"]
